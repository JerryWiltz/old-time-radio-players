<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bold Venture Player</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #15120e; color: #f6ead5; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; }
    h1 { margin-bottom: 6px; }
    .subtle { color: #bcae98; margin-top: 0; }
    .player { position: sticky; top: 0; z-index: 2; background: #292117; border: 1px solid #58462e; border-radius: 14px; padding: 18px; box-shadow: 0 12px 30px #0008; }
    #nowPlaying { min-height: 1.5em; font-weight: 700; }
    audio { width: 100%; margin: 12px 0; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { border: 1px solid #8a6b42; background: #4a3823; color: #fff5e5; border-radius: 8px; padding: 9px 13px; cursor: pointer; }
    button:hover { background: #674c2c; }
    label { margin-left: auto; }
    ol { padding-left: 0; list-style: none; }
    li { border-bottom: 1px solid #372c20; }
    .episode { width: 100%; border: 0; border-radius: 0; background: transparent; text-align: left; padding: 12px; }
    .episode:hover, .episode.active { background: #30261a; }
  </style>
</head>
<body>
  <main>
    <h1>Bold Venture</h1>
    <p class="subtle">Choose an episode and the next one will start automatically.</p>

    <section class="player" aria-label="Audio player">
      <div id="nowPlaying">Select an episode</div>
      <audio id="audio" controls preload="metadata"></audio>
      <div class="controls">
        <button id="previous" type="button">Previous</button>
        <button id="next" type="button">Next</button>
        <label><input id="shuffle" type="checkbox"> Shuffle</label>
        <label><input id="autoNext" type="checkbox" checked> Play next automatically</label>
      </div>
    </section>

    <ol id="episodeList"></ol>
  </main>

  <script>
    const base = "https://archive.org/download/OTRR_Bold_Venture_Singles/";
    const files = [
      "Bold_Venture_5x-xx-xx_ep01_Deadly_Merchandise.mp3",
      "Bold_Venture_5x-xx-xx_ep02_Kuan_Yin_Statue.mp3",
      "Bold_Venture_5x-xx-xx_ep03_Opium_Smugglers_and_Young_Girl.mp3",
      "Bold_Venture_5x-xx-xx_ep04_Johnny_Rice_Story.mp3",
      "Bold_Venture_5x-xx-xx_ep05_Treasure_on_Flamingo_Cay.mp3",
      "Bold_Venture_5x-xx-xx_ep06_He_Who_Laughs_Last.mp3",
      "Bold_Venture_5x-xx-xx_ep07_Espionage_and_Murder_in_San_Toma.mp3",
      "Bold_Venture_5x-xx-xx_ep08_A_Muncie_Murderess_in_Havana.mp3",
      "Bold_Venture_5x-xx-xx_ep09_Fake_American_Passport.mp3",
      "Bold_Venture_5x-xx-xx_ep10_Sailor_Framed_for_Murder.mp3",
      "Bold_Venture_5x-xx-xx_ep11_The_Blue_Moon.mp3",
      "Bold_Venture_5x-xx-xx_ep12_The_Tears_Of_Siva.mp3",
      "Bold_Venture_5x-xx-xx_ep13_A_Half_Million_Reasons_to_Find_Gary.mp3",
      "Bold_Venture_5x-xx-xx_ep14_The_High_Price_of_Treason.mp3",
      "Bold_Venture_5x-xx-xx_ep15_Russian_Roulette.mp3",
      "Bold_Venture_5x-xx-xx_ep16_The_Mystery_of_the_Mary_K.mp3",
      "Bold_Venture_5x-xx-xx_ep17_Death_At_The_Wedding.mp3",
      "Bold_Venture_5x-xx-xx_ep18_A_Twelve_Year_Promise.mp3",
      "Bold_Venture_5x-xx-xx_ep19_Voodoo_Vendetta.mp3",
      "Bold_Venture_5x-xx-xx_ep20_The_Search_for_Tommy_Reed.mp3",
      "Bold_Venture_5x-xx-xx_ep21_Sunken_Treasure_at_20_Fathoms.mp3",
      "Bold_Venture_5x-xx-xx_ep22_The_Ghost_Ship.mp3",
      "Bold_Venture_5x-xx-xx_ep23_Jenny_Ward_Slates_Old_Flame.mp3",
      "Bold_Venture_5x-xx-xx_ep24_Terminal_Key.mp3",
      "Bold_Venture_5x-xx-xx_ep25_Out_of_Control.mp3",
      "Bold_Venture_5x-xx-xx_ep26_Black_Tie_Affair.mp3",
      "Bold_Venture_5x-xx-xx_ep27_Murder_in_the_Yucatan_Peninsula.mp3",
      "Bold_Venture_5x-xx-xx_ep28_Slate_Shannon_Sucker.mp3",
      "Bold_Venture_5x-xx-xx_ep29_Slate_Shannon_Held_for_Ransom.mp3",
      "Bold_Venture_5x-xx-xx_ep30_Camellias_and_a_Ruby.mp3",
      "Bold_Venture_5x-xx-xx_ep31_Passage_for_Mario_Carada.mp3",
      "Bold_Venture_5x-xx-xx_ep32_Darby_and_Joan_Incorporated.mp3",
      "Bold_Venture_5x-xx-xx_ep33_Mutineers_of_the_SS_Marino_Victory.mp3",
      "Bold_Venture_5x-xx-xx_ep34_Bold_Venture_Stolen.mp3",
      "Bold_Venture_5x-xx-xx_ep35_Slates_Stolen_DaVinci.mp3",
      "Bold_Venture_5x-xx-xx_ep36_Paolo_Framed_for_Jewel_Robbery.mp3",
      "Bold_Venture_5x-xx-xx_ep37_Cruise_To_Batabano.mp3",
      "Bold_Venture_5x-xx-xx_ep38_Slates_Stolen_Identity.mp3",
      "Bold_Venture_5x-xx-xx_ep39_Tabard_of_Pizarro.mp3",
      "Bold_Venture_5x-xx-xx_ep40_Escape_From_Guantanamo.mp3",
      "Bold_Venture_5x-xx-xx_ep41_Crazy_Old_Carlo.mp3",
      "Bold_Venture_5x-xx-xx_ep42_Innocence_in_Trujillo.mp3",
      "Bold_Venture_5x-xx-xx_ep43_An_Invitation_to_Death.mp3",
      "Bold_Venture_5x-xx-xx_ep44_Background_Shots_Can_Kill_You.mp3",
      "Bold_Venture_5x-xx-xx_ep45_Revenge_Equals_Murder_Times_Two.mp3",
      "Bold_Venture_5x-xx-xx_ep46_A_Backstabbing_at_Shannons_Place.mp3",
      "Bold_Venture_5x-xx-xx_ep47_Im_Going_To_Die.mp3",
      "Bold_Venture_5x-xx-xx_ep48_The_One_That_Got_Away.mp3",
      "Bold_Venture_5x-xx-xx_ep49_Man_From_Sumatra.mp3",
      "Bold_Venture_5x-xx-xx_ep50_The_Big_KO.mp3",
      "Bold_Venture_5x-xx-xx_ep51_El_Indio.mp3",
      "Bold_Venture_5x-xx-xx_ep52_Diamond_Fencing_and_Fisticuffs.mp3",
      "Bold_Venture_5x-xx-xx_ep53_Revenge_is_Sweet.mp3",
      "Bold_Venture_5x-xx-xx_ep54_Havens_Venezuelan_Isle.mp3",
      "Bold_Venture_5x-xx-xx_ep55_With_Friends_Like_These.mp3",
      "Bold_Venture_5x-xx-xx_ep56_Marriage_And_Murder.mp3",
      "Bold_Venture_5x-xx-xx_ep60_Seor_Rufio.mp3"
    ];

    const alternateUrls = new Map([
      ["Bold_Venture_5x-xx-xx_ep16_The_Mystery_of_the_Mary_K.mp3","https://archive.org/download/BoldVenture520421TheMysteryOfTheMaryK/Bold%20Venture%2052-04-21%20The%20Mystery%20of%20the%20Mary%20K.mp3"]
    ]);

    const episodes = files.map((file) => ({
      title: file.replace(/^Bold_Venture_5x-xx-xx_ep(\d+)_/, "Episode $1 - ").replace(/\.mp3$/i, "").replaceAll("_", " "),
      url: alternateUrls.get(file) || base + encodeURIComponent(file).replace(/[!'()*]/g, (character) => `%${character.charCodeAt(0).toString(16).toUpperCase()}`)
    }));
    const audio = document.querySelector("#audio");
    const nowPlaying = document.querySelector("#nowPlaying");
    const list = document.querySelector("#episodeList");
    const shuffle = document.querySelector("#shuffle");
    const autoNext = document.querySelector("#autoNext");
    let currentIndex = -1;

    function getNextIndex() {
      if (!shuffle.checked || episodes.length < 2) return currentIndex < 0 ? 0 : currentIndex + 1;
      let nextIndex;
      do nextIndex = Math.floor(Math.random() * episodes.length);
      while (nextIndex === currentIndex);
      return nextIndex;
    }

    function loadEpisode(index, play = true) {
      currentIndex = (index + episodes.length) % episodes.length;
      const episode = episodes[currentIndex];
      audio.src = episode.url;
      nowPlaying.textContent = `${currentIndex + 1} of ${episodes.length}: ${episode.title}`;
      document.querySelectorAll(".episode").forEach((button, i) => button.classList.toggle("active", i === currentIndex));
      document.querySelector(".episode.active")?.scrollIntoView({ block: "nearest" });
      if (play) audio.play().catch(() => {});
    }

    episodes.forEach((episode, index) => {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.className = "episode";
      button.type = "button";
      button.textContent = `${index + 1}. ${episode.title}`;
      button.addEventListener("click", () => loadEpisode(index));
      item.append(button);
      list.append(item);
    });

    document.querySelector("#previous").addEventListener("click", () => loadEpisode(currentIndex <= 0 ? episodes.length - 1 : currentIndex - 1));
    document.querySelector("#next").addEventListener("click", () => loadEpisode(getNextIndex()));
    audio.addEventListener("ended", () => {
      if (autoNext.checked) loadEpisode(getNextIndex());
    });
  </script>
</body>
</html>
