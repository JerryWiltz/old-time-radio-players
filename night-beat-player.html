<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Beat Player</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #15120e; color: #f6ead5; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; }
    h1 { margin-bottom: 6px; }
    .subtle { color: #bcae98; margin-top: 0; }
    .player { position: sticky; top: 0; z-index: 2; background: #292117; border: 1px solid #58462e; border-radius: 14px; padding: 18px; box-shadow: 0 12px 30px #0008; }
    #nowPlaying { min-height: 1.5em; font-weight: 700; }
    audio { width: 100%; margin: 12px 0; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { border: 1px solid #8a6b42; background: #4a3823; color: #fff5e5; border-radius: 8px; padding: 9px 13px; cursor: pointer; }
    button:hover { background: #674c2c; }
    label { margin-left: auto; }
    ol { padding-left: 0; list-style: none; }
    li { border-bottom: 1px solid #372c20; }
    .episode { width: 100%; border: 0; border-radius: 0; background: transparent; text-align: left; padding: 12px; }
    .episode:hover, .episode.active { background: #30261a; }
  </style>
</head>
<body>
  <main>
    <h1>Night Beat</h1>
    <p class="subtle">Choose an episode and the next one will start automatically.</p>

    <section class="player" aria-label="Audio player">
      <div id="nowPlaying">Select an episode</div>
      <audio id="audio" controls preload="metadata"></audio>
      <div class="controls">
        <button id="previous" type="button">Previous</button>
        <button id="next" type="button">Next</button>
        <label><input id="shuffle" type="checkbox"> Shuffle</label>
        <label><input id="autoNext" type="checkbox" checked> Play next automatically</label>
      </div>
    </section>

    <ol id="episodeList"></ol>
  </main>

  <script>
    const base = "https://archive.org/download/NightBeataccurate/";
    const originalFiles = [
      "NB 1949-05-19 The Ted Carter Murder Case(Audition).mp3",
      "NB 1950-01-13 The Elevator Caper (Audition).mp3",
      "NB 1950-02-06 (0001) Zero.mp3",
      "NB 1950-02-13 (0002) The Night Is a Weapon.mp3",
      "NB 1950-02-20 (0003) A World All of His Own.mp3",
      "NB 1950-02-27 (0004) The Girl in the Park.mp3",
      "NB 1950-03-06 (0005) Number 13.mp3",
      "NB 1950-03-13 (0006) Am I My Brother%27s Keeper.mp3",
      "NB 1950-03-20 (0007) The Man Who Claimed to Be Dead.mp3",
      "NB 1950-03-27 (0008) Flowers on the Water.mp3",
      "NB 1950-04-10 (0010) I Know Your Secret.mp3",
      "NB 1950-04-17 (0011) Tong War.mp3",
      "NB 1950-05-01 (0013) Mentallo, the Mental Marvel.mp3",

      "NB 1950-05-29 (0017) Harlan Matthews, Stamp Dealer.mp3",
      "NB 1950-06-05 (0018) The Girl from Kansas.mp3",
      "NB 1950-06-12 (0019) Football Player and the Syndicate.mp3",
      "NB 1950-06-19 (0020) Vincent and the Painter.mp3",
      "NB 1950-06-26 (0021) The Juvenile Gangster.mp3",
      "NB 1950-07-03 (0022) Marty.mp3",
      "NB 1950-07-10 (0023) Twill Be the Death of Me.mp3",
      "NB 1950-07-17 (0024) Molly Keller.ogg",
      "NB 1950-07-24 (0025) The Devil%27s Bible.mp3",

      "NB 1950-08-07 (0027) Old Blind Pop.mp3",
      "NB 1950-08-14 (0028) Gunner%27s Last Fight.mp3",
      "NB 1950-08-21 (0029) Doctor%27s Secret.mp3",
      "NB 1950-09-04 (0031) Old Home Week.mp3",
      "NB 1950-09-11 (0032) The Hunter Becomes the Hunted.mp3",

      "NB 1951-05-18 (0042) Juke Box Romance aka Juke Box Julie.ogg",
      "NB 1951-05-25 (0043) Fear.mp3",
      "NB 1951-06-01 (0044) Will of Mrs Orloff.mp3",
      "NB 1951-06-08 (0045) The Search for Fred aka A Hot Night In June.mp3",
      "NB 1951-06-15 (0046) Otto, The Music Man aka Old Baldy.mp3",

      "NB 1951-12-28 (0074) Expectant Father.mp3",
      "NB 1952-03-27 (0084) Gusher James (AFRS).mp3",
      "NB 1952-05-01 (0092) Pay up or Die.mp3",
      "NB 1952-05-08 (0093) Long Live the Clown.mp3",
      "NB 1952-05-15 (0094) Death of Riley.mp3",
      "NB 1952-05-22 (0095) Target for a Week.mp3",
      "NB 1952-05-29 (0096) The Jockey Brothers.ogg",
      "NB 1952-06-05 (0097) Marvelous Machine.mp3",
      "NB 1952-06-19 (0098) Railroaded.mp3",
      "NB 1952-06-26 (0099) Reformer.Mp3",
      "NB 1952-07-03 (0100) The Old Itch aka Stone%27s Love Affair.mp3",
      "NB 1952-07-17 (0102) Taste of Peaches.Mp3",
      "NB 1952-07-31 (0104) Flight from Fear.mp3",
      "NB 1952-08-07 (0105) Somebody Stop Ann.mp3",
      "NB 1952-08-14 (0106) His Name Was Luke.mp3",
      "NB 1952-08-21 (0107) The Man with the Red Hair.mp3",
      "NB 1952-09-04 (0109) Ellen.mp3",
      "NB 1952-09-11 (0110) Larry the Understudy.mp3",
      "NB 1952-09-18 (0111) Policy Wheel Racket.mp3",
      "NB 1952-09-25 (0112) The Bug Killings.mp3",
      "NB 1953-11-05 (xxxx) A Search in the Night (TV.mp3"
    ];

    const archiveFiles = [
      "Night_Beat_50_04_09_xxxx_The_Night_Is_A_Weapon_Special_Rebroadcast.mp3",
      "Night_Beat_50_04_16_xxxx_World_Of_His_Own_Special_Rebroadcast_Certified_but_is_it.mp3",
      "Night_Beat_50_04_23_xxxx_Girl_In_The_Park_Special_ReBroadcast.mp3",
      "Night_Beat_50_04_30_xxxx_Am_I_My_Brothers_Keeper_Special_Rebroadcast.mp3",
      "Night_Beat_51_07_20_0051_The_City_At_Your_Fingertips.mp3"
    ];
    const files = [...originalFiles, ...archiveFiles];

    const alternateUrls = new Map([
      ["Night_Beat_50_04_09_xxxx_The_Night_Is_A_Weapon_Special_Rebroadcast.mp3","https://archive.org/download/Nightbeat_otr/500409_The_Night_is_a_Weapon_special_rebroadcast.mp3"],
      ["Night_Beat_50_04_16_xxxx_World_Of_His_Own_Special_Rebroadcast_Certified_but_is_it.mp3","https://archive.org/download/NightBeat/Night_Beat_50_04_16_xxxx_World_Of_His_Own_Special_Rebroadcast_Certified_but_is_it.mp3"],
      ["Night_Beat_50_04_23_xxxx_Girl_In_The_Park_Special_ReBroadcast.mp3","https://archive.org/download/Nightbeat_otr/500423_The_Girl_in_the_Park.mp3"],
      ["Night_Beat_50_04_30_xxxx_Am_I_My_Brothers_Keeper_Special_Rebroadcast.mp3","https://archive.org/download/NightBeat/Night_Beat_50_04_30_xxxx_Am_I_My_Brothers_Keeper_Special_Rebroadcast.mp3"],
      ["Night_Beat_51_07_20_0051_The_City_At_Your_Fingertips.mp3","https://archive.org/download/NightBeat/Night_Beat_51_07_20_0051_The_City_At_Your_Fingertips.mp3"]
    ]);

    function formatTitle(file) {
      const archiveMatch = file.match(/^Night_Beat_(\d{2})_(\d{2})_(\d{2})_[^_]+_(.+)\.mp3$/i);
      if (archiveMatch) return `19${archiveMatch[1]}-${archiveMatch[2]}-${archiveMatch[3]} ${archiveMatch[4].replaceAll("_", " ")}`;
      return file.replace(/^NB /, "").replace(/\.(?:mp3|ogg)$/i, "").replaceAll("%27", "'");
    }

    const episodes = files.map((file) => ({
      title: formatTitle(file),
      url: alternateUrls.get(file) || base + encodeURIComponent(file).replace(/[!'()*]/g, (character) => `%${character.charCodeAt(0).toString(16).toUpperCase()}`)
    }));
    const audio = document.querySelector("#audio");
    const nowPlaying = document.querySelector("#nowPlaying");
    const list = document.querySelector("#episodeList");
    const shuffle = document.querySelector("#shuffle");
    const autoNext = document.querySelector("#autoNext");
    let currentIndex = -1;

    function getNextIndex() {
      if (!shuffle.checked || episodes.length < 2) return currentIndex < 0 ? 0 : currentIndex + 1;
      let nextIndex;
      do nextIndex = Math.floor(Math.random() * episodes.length);
      while (nextIndex === currentIndex);
      return nextIndex;
    }

    function loadEpisode(index, play = true) {
      currentIndex = (index + episodes.length) % episodes.length;
      const episode = episodes[currentIndex];
      audio.src = episode.url;
      nowPlaying.textContent = `${currentIndex + 1} of ${episodes.length}: ${episode.title}`;
      document.querySelectorAll(".episode").forEach((button, i) => button.classList.toggle("active", i === currentIndex));
      document.querySelector(".episode.active")?.scrollIntoView({ block: "nearest" });
      if (play) audio.play().catch(() => {});
    }

    episodes.forEach((episode, index) => {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.className = "episode";
      button.type = "button";
      button.textContent = `${index + 1}. ${episode.title}`;
      button.addEventListener("click", () => loadEpisode(index));
      item.append(button);
      list.append(item);
    });

    document.querySelector("#previous").addEventListener("click", () => loadEpisode(currentIndex <= 0 ? episodes.length - 1 : currentIndex - 1));
    document.querySelector("#next").addEventListener("click", () => loadEpisode(getNextIndex()));
    audio.addEventListener("ended", () => {
      if (autoNext.checked) loadEpisode(getNextIndex());
    });
  </script>
</body>
</html>
